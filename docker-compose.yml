services:
  db:
    image: mcr.microsoft.com/mssql/server:2022-latest
    container_name: gesco-db
    environment:
      - ACCEPT_EULA=Y
      - MSSQL_SA_PASSWORD=Nrcm.2024*
      - MSSQL_PID=Developer
    ports:
      - "1433:1433"
    volumes:
      - sql_data:/var/opt/mssql

  backend:
    build:
      context: .
      dockerfile: Gesco.API/Dockerfile
    container_name: gesco-api
    # Chrome (PDF ANDE) necesita /dev/shm; sin esto falla el launch en Linux.
    shm_size: "2gb"
    environment:
      - ASPNETCORE_ENVIRONMENT=Production
      - ConnectionStrings__DefaultConnection=Server=db;Database=GESCO_DB;User Id=sa;Password=Nrcm.2024*;TrustServerCertificate=True;
      # Credenciales de correo: se definen en el archivo .env de cada servidor (ver .env.example)
      - EmailSettings__SenderEmail=${EMAIL_SENDER:-}
      - EmailSettings__AppPassword=${EMAIL_APP_PASSWORD:-}
      - CHROME_PATH=/usr/bin/chromium
      - PUPPETEER_EXECUTABLE_PATH=/usr/bin/chromium
      - PUPPETEER_CACHE_DIR=/tmp/puppeteer-chrome
    depends_on:
      - db
    ports:
      - "8080:8080"
    volumes:
      # Documentos del CRM: viven en un volumen para que no se borren al reconstruir la imagen
      - crm_documentos:/app/almacen-crm

  frontend:
    build:
      context: ./gesco-web
      args:
        NEXT_PUBLIC_API_BASE_URL: ${NEXT_PUBLIC_API_BASE_URL:-https://vordia.duckdns.org}
    container_name: gesco-web
    environment:
      - NEXT_PUBLIC_API_BASE_URL=${NEXT_PUBLIC_API_BASE_URL:-https://vordia.duckdns.org}
    ports:
      - "3000:3000" # Mapeamos el puerto 80 del exterior al 3000 de Next.js
    depends_on:
      - backend

  nginx-proxy:
    image: 'jc21/nginx-proxy-manager:latest'
    container_name: nginx-proxy
    restart: always
    ports:
      - '80:80' # Puerto para tráfico normal
      - '443:443' # Puerto para HTTPS (CANDADITO)
      - '81:81' # Panel de control de certificados
    volumes:
      - ./data/nginx:/data
      - ./data/letsencrypt:/etc/letsencrypt

volumes:
  sql_data:
  crm_documentos:
