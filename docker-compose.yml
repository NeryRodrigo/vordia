services:
  db:
    image: mcr.microsoft.com/mssql/server:2022-latest
    container_name: gesco-db
    environment:
      - ACCEPT_EULA=Y
      - MSSQL_SA_PASSWORD=Nrcm.2024*
      - MSSQL_PID=Developer
    ports:
      - "1433:1433"
    volumes:
      - sql_data:/var/opt/mssql

  backend:
    build:
      context: .
      dockerfile: Gesco.API/Dockerfile
    container_name: gesco-api
    environment:
      - ASPNETCORE_ENVIRONMENT=Production
      - ConnectionStrings__DefaultConnection=Server=db;Database=GESCO_DB;User Id=sa;Password=Nrcm.2024*;TrustServerCertificate=True;
    depends_on:
      - db
    ports:
      - "8080:8080"

  frontend:
    build:
      context: ./gesco-web # <--- Asegrate que coincida con el nombre de tu carpeta
    container_name: gesco-web
    environment:
      - NEXT_PUBLIC_API_URL:"http://vordia-aguz.duckdns.org:8080" # Tu IP de Google Cloud
    ports:
      - "3000:3000" # Mapeamos el puerto 80 del exterior al 3000 de Next.js
    depends_on:
      - backend

  nginx-proxy:
    image: 'jc21/nginx-proxy-manager:latest'
    container_name: nginx-proxy
    restart: always
    ports:
      - '80:80' # Puerto para tráfico normal
      - '443:443' # Puerto para HTTPS (CANDADITO)
      - '81:81' # Panel de control de certificados
    volumes:
      - ./data/nginx:/data
      - ./data/letsencrypt:/etc/letsencrypt

volumes:
  sql_data:
